<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — Horror Haven</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="nav">
    <a class="brand title-font" href="/">Horror Haven</a>
    <div class="nav-links">
      <a href="/app.html">Chat</a>
      <a href="/movies.html">Movies</a>
      <a href="/games.html">Games</a>
      <a href="/news.html">News</a>
      <a href="/about.html">About</a>
    </div>
  </nav>

  <div class="auth-wrap card" style="max-width: 480px;">
    <h1 class="title-font">Settings</h1>

    <div class="field">
      <label>Username</label>
      <div id="settings-username" style="padding: 10px 0;"></div>
    </div>

    <form id="username-form" class="field">
      <label for="new-username">Change username</label>
      <input id="new-username" maxlength="20" autocomplete="off" placeholder="New username" />
      <button class="btn btn-ghost btn-block" type="submit" style="margin-top: 8px;">Save username</button>
    </form>
    <div class="error-msg" id="username-error"></div>

    <div class="field">
      <label>Membership</label>
      <div id="settings-tier" style="padding: 10px 0;"></div>
    </div>

    <button class="btn btn-gold btn-block" id="manage-btn" hidden>Manage subscription</button>
    <button class="btn btn-block" id="upgrade-btn" hidden>Go Premium — $4.99/mo</button>
    <div class="error-msg" id="error"></div>

    <p class="hint"><a href="/app.html">&larr; Back to chat</a></p>
  </div>

  <script>
    async function init() {
      const res = await fetch('/api/me');
      const user = await res.json();
      if (!user) {
        window.location.href = '/login.html';
        return;
      }

      document.getElementById('settings-username').textContent = user.username;
      let tierHtml = '<span class="badge free">Free</span>';
      if (user.isPremium) tierHtml = '<span class="badge gold">Premium</span>';
      if (user.isAdmin) tierHtml += ' <span class="badge gold">Admin (full access)</span>';
      document.getElementById('settings-tier').innerHTML = tierHtml;

      if (user.isPremium) {
        document.getElementById('manage-btn').hidden = false;
      } else {
        document.getElementById('upgrade-btn').hidden = false;
      }
    }

    document.getElementById('username-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('username-error');
      errorEl.textContent = '';
      const input = document.getElementById('new-username');
      const value = input.value.trim();
      if (!value) return;
      const res = await fetch('/api/settings/username', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: value }),
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('settings-username').textContent = data.username;
        input.value = '';
        return;
      }

      if (res.status === 402 && data.requiresPayment) {
        errorEl.innerHTML = '';
        const msg = document.createElement('div');
        msg.textContent = data.error;
        errorEl.appendChild(msg);
        const payBtn = document.createElement('button');
        payBtn.className = 'btn btn-gold';
        payBtn.style.marginTop = '8px';
        payBtn.textContent = 'Pay $3 to change username';
        payBtn.addEventListener('click', async () => {
          const checkoutRes = await fetch('/api/settings/username/checkout', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: value }),
          });
          const checkoutData = await checkoutRes.json();
          if (checkoutRes.ok && checkoutData.url) {
            window.location.href = checkoutData.url;
          } else {
            errorEl.textContent = checkoutData.error || 'Could not start checkout.';
          }
        });
        errorEl.appendChild(payBtn);
        return;
      }

      errorEl.textContent = data.error || 'Could not update username.';
    });

    async function checkUsernameChangeReturn() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('nameChangePaid') !== '1') return;
      window.history.replaceState({}, '', '/settings.html');

      const errorEl = document.getElementById('username-error');
      errorEl.textContent = 'Payment received! Applying your new username...';
      for (let attempt = 0; attempt < 10; attempt += 1) {
        await new Promise((resolve) => setTimeout(resolve, 1500));
        const res = await fetch('/api/me');
        const user = await res.json();
        if (user) {
          document.getElementById('settings-username').textContent = user.username;
        }
      }
      errorEl.textContent = '';
    }

    document.getElementById('manage-btn').addEventListener('click', async () => {
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      const res = await fetch('/api/create-portal-session', { method: 'POST' });
      const data = await res.json();
      if (res.ok && data.url) {
        window.location.href = data.url;
      } else {
        errorEl.textContent = data.error || 'Could not open billing portal.';
      }
    });

    document.getElementById('upgrade-btn').addEventListener('click', async () => {
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      const res = await fetch('/api/create-checkout-session', { method: 'POST' });
      const data = await res.json();
      if (res.ok && data.url) {
        window.location.href = data.url;
      } else {
        errorEl.textContent = data.error || 'Could not start checkout.';
      }
    });

    init().then(checkUsernameChangeReturn);
  </script>
</body>
</html>
